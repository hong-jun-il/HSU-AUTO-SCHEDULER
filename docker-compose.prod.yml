services:
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./nginx/ssl/certificate.crt:/etc/nginx/ssl/certificate.crt:ro
      - ./nginx/ssl/private.key:/etc/nginx/ssl/private.key:ro
    networks:
      - public
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    networks:
      - private
    volumes:
      # PostgreSQL 실제 데이터 파일. 테이블은 api 가 뜰 때 Flyway 가 만든다
      - hsu_auto_scheduler_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  fastapi:
    build:
      context: ./ortools-scheduler
      dockerfile: dockerfile.prod
    restart: always
    networks:
      - private

  api:
    build:
      context: ./hsu-auto-scheduler-be
      dockerfile: Dockerfile
    restart: always
    ports:
      # 외부에는 nginx 로만 연다. 스크래퍼는 SSH 터널로 이 포트에 붙는다 (ssh -L 5000:localhost:5000 <서버>)
      - "127.0.0.1:5000:5000"
    networks:
      - public
      - private
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      FAST_API_BASE_URL: ${FAST_API_BASE_URL:-http://fastapi:4113}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://hsu-auto-scheduler.vercel.app}
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_started

networks:
  public:
  private:

volumes:
  hsu_auto_scheduler_pg_data:

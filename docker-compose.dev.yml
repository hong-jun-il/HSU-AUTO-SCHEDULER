services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hsu_auto_scheduler}
      POSTGRES_USER: ${DB_USERNAME:-hsu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hsu}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 실제 데이터 파일
      # 테이블은 백엔드(Spring)가 뜰 때 Flyway 가 만든다
      # (hsu-auto-scheduler-api/src/main/resources/db/migration)
      - hsu_auto_scheduler_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hsu_auto_scheduler_pg_data:

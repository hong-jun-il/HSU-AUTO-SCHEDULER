# conf.d 에 들어가므로 http 블록 안이다
# 요청 제한 (기존 Nest throttler 대신). 시간표 추천은 OR-Tools 를 돌려서 더 좁게 막는다
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=timetables:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name hsu-auto-scheduler.kro.kr;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name hsu-auto-scheduler.kro.kr;

    ssl_certificate /etc/nginx/ssl/certificate.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN";

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 스크래퍼 전용 저장 API 는 외부에 열지 않는다 (서버의 127.0.0.1:5000 으로 SSH 터널을 통해 부른다)
    location /admin/ {
        return 404;
    }

    location ~ ^/api/semesters/[^/]+/timetables$ {
        limit_req zone=timetables burst=5 nodelay;
        proxy_pass http://be:5000;
    }

    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://be:5000;
    }
}

spring:
  application:
    name: hsu-auto-scheduler-be

  datasource:
    # 기본값은 루트 docker-compose.dev.yml 의 postgres 서비스를 가리킨다. 운영에서는 환경변수로 덮어쓴다
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:hsu_auto_scheduler}
    username: ${DB_USERNAME:hsu}
    password: ${DB_PASSWORD:hsu}
    hikari:
      data-source-properties:
        # JDBC 배치 insert 를 여러 행 INSERT 한 문장으로 묶어 보낸다 (학기 저장이 빨라진다)
        reWriteBatchedInserts: true

  jackson:
    # API 필드 이름은 snake_case (기존 Nest API·프론트·스크래퍼와 같다)
    property-naming-strategy: SNAKE_CASE

  jpa:
    # 요청이 끝나기 전까지 DB 커넥션을 붙잡아 두지 않는다
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 가 만든다. Hibernate 는 엔티티와 테이블이 어긋나면 기동을 막기만 한다
      ddl-auto: validate

server:
  # 기존 Nest 서버와 같은 포트 (nginx·프론트 설정을 바꾸지 않는다)
  port: ${PORT:5000}

admin:
  # 스크래퍼가 X-Admin-Token 헤더로 보내는 값. 비어 있으면 /admin 요청을 모두 거절한다
  token: ${ADMIN_TOKEN:}

solver:
  # ortools-scheduler(FastAPI) 주소. 운영 compose 에서는 FAST_API_BASE_URL 로 준다
  base-url: ${FAST_API_BASE_URL:http://localhost:4113}
  # 솔버 자체 제한이 5초라서 여유를 둔다
  timeout: 10s

cors:
  # 쉼표로 여러 개 (예: https://hsu-auto-scheduler.vercel.app,http://localhost:3000). 기본은 모두 허용
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
